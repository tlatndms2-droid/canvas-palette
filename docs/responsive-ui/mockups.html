<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Palette Responsive UI Mockups</title>
  <style>
    :root{color-scheme:dark;--bg:#17181b;--surface:#202126;--raised:#272931;--border:#3c3f49;--text:#e6e7eb;--muted:#9ca0ab;--accent:#9b6cff;--tint:rgba(155,108,255,.16);--shadow:0 18px 50px rgba(0,0,0,.38);font:14px/1.35 Inter,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:#0f1012;color:var(--text)}button,input,select{font:inherit;color:inherit}button{min-height:30px;padding:4px 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}button.icon{width:30px;padding:0}.active{border-color:var(--accent);background:var(--tint);color:#d8c8ff}.muted{color:var(--muted)}
    .sheet{position:relative;width:100vw;height:100vh;padding:52px 44px;background:radial-gradient(circle at 15% 0%,#28223a 0,transparent 32%),#111216}.title{position:absolute;top:16px;left:44px;font-size:20px;font-weight:700}.measure{position:absolute;top:18px;right:44px;color:var(--muted);font-size:12px}.app{position:relative;height:100%;overflow:hidden;border:1px solid #343640;border-radius:12px;background:#16171b;box-shadow:var(--shadow)}
    .topbar{height:34px;border-bottom:1px solid #2e3037;background:#1b1c21}.workspace{position:absolute;inset:34px 0 0;background-image:radial-gradient(#353740 1px,transparent 1px);background-size:18px 18px}.node{position:absolute;width:150px;height:92px;padding:12px;border:1px solid #535663;border-radius:10px;background:#22242a}.node.a{top:90px;left:80px}.node.b{top:255px;left:260px}.node.c{top:130px;right:80px}
    .palette{position:absolute;overflow:hidden;border:1px solid var(--border);border-radius:13px;background:var(--bg);box-shadow:var(--shadow)}.palette-header,.side-header{display:flex;align-items:center;gap:7px;height:46px;padding:7px 9px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{font-weight:700;white-space:nowrap}.tabs{display:flex;gap:3px;margin:auto;padding:3px;border:1px solid var(--border);border-radius:8px}.tabs button{min-height:26px;border:0;padding:2px 12px;background:transparent}.tabs .active{background:var(--tint)}.actions{display:flex;gap:3px;margin-left:auto}
    .content{position:absolute;inset:46px 0 48px;display:grid;min-height:0}.pane{min-width:0;overflow:hidden;padding:11px;background:var(--bg)}.pane+.pane{border-left:1px solid var(--border)}.pane-head{display:flex;align-items:center;gap:6px;height:30px;margin-bottom:8px;font-weight:700}.pane-head span:first-child{flex:1}.control{display:grid;align-content:start;gap:8px}.control label{font-size:12px;color:var(--muted)}.search{width:100%;height:32px;padding:5px 9px;border:1px solid var(--border);border-radius:6px;background:#121317}.filter-row,.quick,.toolbar{display:flex;align-items:center;gap:5px}.filter-row{flex-wrap:wrap}.filter-row button{font-size:12px;padding:2px 7px}.range{height:5px;border-radius:4px;background:linear-gradient(90deg,var(--accent) 58%,#3a3d46 58%)}
    .assets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-content:start}.card{min-width:0;height:142px;padding:9px;border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:8px;background:var(--raised)}.card.selected{box-shadow:0 0 0 1px var(--accent)}.card strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thumb{height:72px;margin:8px 0;border-radius:6px;background:linear-gradient(135deg,#343744,#252733)}.meta{font-size:11px;color:var(--muted)}.preview-box{height:190px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--raised)}
    .bottom{position:absolute;right:0;bottom:0;left:0;display:flex;align-items:center;gap:7px;height:48px;padding:8px 10px;border-top:1px solid var(--border);background:var(--surface)}.bottom .muted{margin-right:auto}.quick{display:none;padding:8px 10px;border-bottom:1px solid var(--border)}
    .drawer{position:absolute;z-index:5;top:46px;right:0;bottom:48px;width:min(340px,calc(100% - 16px));padding:12px;border-left:1px solid var(--border);background:var(--bg);box-shadow:-14px 0 30px rgba(0,0,0,.38)}.drawer .close{float:right}.drawer h3{margin:4px 0 14px}.attached-flyout{position:absolute;z-index:6;overflow:auto;padding:12px;border:1px solid var(--border);background:var(--bg);box-shadow:var(--shadow)}.attached-flyout .close{float:right}.attached-flyout h3{margin:4px 0 14px}.flyout-kicker{margin:-7px 0 12px;color:var(--muted);font-size:11px}.annotation{position:absolute;z-index:8;padding:5px 8px;border:1px solid #6753a2;border-radius:6px;background:#271f3c;color:#d9ccff;font-size:11px}
    .mini-wide .palette{inset:76px 70px 62px}.mini-wide .content{grid-template-columns:220px minmax(0,1fr) 260px}.mini-wide .annotation{left:82px;bottom:18px}
    .mini-medium .palette{top:78px;right:55px;bottom:64px;left:55px}.mini-medium .content{top:95px;grid-template-columns:minmax(0,1fr) 250px}.mini-medium .quick{display:flex}.mini-medium .quick .search{flex:1}.mini-medium .annotation{left:70px;bottom:18px}
    .mini-narrow .palette{top:58px;bottom:54px;left:50%;width:600px;transform:translateX(-50%)}.mini-narrow .content{top:95px;grid-template-columns:1fr}.mini-narrow .quick{display:flex}.mini-narrow .quick .search{flex:1}.mini-narrow .assets{grid-template-columns:repeat(2,minmax(0,1fr))}.mini-narrow .annotation{left:65px;bottom:12px}
    .mini-minimum .palette{top:42px;bottom:42px;left:54px;width:360px;transform:none}.mini-minimum .brand{max-width:72px;overflow:hidden;text-overflow:ellipsis}.mini-minimum .tabs button{padding:2px 7px}.mini-minimum .content{top:138px;grid-template-columns:1fr}.mini-minimum .quick{display:grid;grid-template-columns:1fr auto auto auto}.mini-minimum .quick .search{grid-column:1/-1}.mini-minimum .quick button:last-child{border-color:var(--accent);background:var(--tint)}.mini-minimum .assets{grid-template-columns:1fr}.mini-minimum .card{height:118px}.mini-minimum .bottom button:not(.primary){display:none}.mini-preview-flyout{top:42px;bottom:42px;left:414px;width:320px;border-radius:0 13px 13px 0}.mini-minimum .annotation{right:28px;bottom:8px}
    .side-app{position:relative;display:grid;grid-template-columns:1fr var(--side-width);height:100%}.canvas-bg{position:relative;background-image:radial-gradient(#353740 1px,transparent 1px);background-size:18px 18px}.side{position:relative;min-width:0;overflow:hidden;border-left:1px solid var(--border);background:var(--bg)}.side-header{height:48px}.workspace-row,.side-search{display:flex;gap:6px;padding:8px 10px}.workspace-row select{min-width:0;flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px}.side-search .search{flex:1}.side-body{display:grid;height:calc(100% - 146px);border-top:1px solid var(--border)}.side-panel{min-width:0;overflow:hidden;padding:10px}.side-panel+.side-panel{border-left:1px solid var(--border)}.tree{display:grid;gap:4px}.tree div{overflow:hidden;padding:5px 6px;border-radius:5px;text-overflow:ellipsis;white-space:nowrap}.tree .active{background:var(--tint)}.index-grid{display:grid;grid-template-columns:1fr 1fr;height:150px;border-top:1px solid var(--border)}.side-tabs{display:flex;gap:3px;padding:6px 8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.side-tabs button{flex:1}.side-tabs .active-trigger{border-color:var(--accent);color:#d8c8ff}.side-wide{--side-width:620px}.side-wide .side-body{grid-template-columns:minmax(0,1fr) 230px}.side-medium{--side-width:430px}.side-medium .side-body,.side-minimum .side-body{grid-template-columns:1fr}.side-medium .assets{grid-template-columns:repeat(2,minmax(0,1fr))}.side-minimum{--side-width:300px}.side-minimum .brand{max-width:110px;overflow:hidden;text-overflow:ellipsis}.side-minimum .side-header button.text,.side-minimum .workspace-row span{display:none}.side-minimum .assets{grid-template-columns:1fr}.side-minimum .card{height:122px}.side-indexes-flyout{top:146px;right:300px;bottom:0;width:300px;border-radius:10px 0 0 10px}.side-minimum .annotation,.side-medium .annotation{right:14px;bottom:10px}
    .side-wide .side-body{height:calc(100% - 296px)}
    .side-medium .side-header button.text:first-of-type{display:none}
  </style>
</head>
<body>
<main id="root"></main>
<script>
  const q=new URLSearchParams(location.search),state=q.get('state')||'mini-wide';
  const cards=(n=6)=>Array.from({length:n},(_,i)=>`<article class="card ${i===1?'selected':''}"><strong>${['Project concept','Reference image','Research note','Canvas group'][i%4]}</strong><div class="thumb"></div><div class="meta">#design · ${i+1} linked space</div></article>`).join('');
  const controls=`<section class="pane control"><div class="pane-head"><span>Control</span><button class="icon">×</button></div><label>Search</label><input class="search" value="responsive UI"><label>Type</label><div class="filter-row"><button class="active">All</button><button>MD</button><button>Card</button><button>Image</button></div><label>Item size · Medium</label><div class="range"></div><label>Sort</label><button>Modified · Newest</button></section>`;
  const preview=`<section class="pane"><div class="pane-head"><span>Preview</span><button class="icon">×</button></div><div class="preview-box"><strong>Reference image</strong><div class="thumb"></div><p class="muted">Selected item metadata and Canvas links</p></div></section>`;
  const quick=`<div class="quick"><input class="search" value="responsive UI"><button>All</button><button title="Item size">◫</button><button title="Control drawer">☰</button><button title="Preview drawer">◧</button></div>`;
  function mini(mode){const flyout=mode==='minimum'?`<aside class="attached-flyout mini-preview-flyout"><button class="icon close">×</button><h3>Preview</h3><p class="flyout-kicker">Attached to Mini Palette · opens over Canvas</p><div class="preview-box"><strong>Reference image</strong><div class="thumb"></div><p class="muted">Selected item metadata and Canvas links</p></div></aside>`:'';return `<div class="sheet mini-${mode}"><div class="title">Mini Palette — ${mode[0].toUpperCase()+mode.slice(1)}</div><div class="measure">${{wide:'≥ 900px',medium:'680–899px',narrow:'480–679px',minimum:'360–479px'}[mode]}</div><div class="app"><div class="topbar"></div><div class="workspace"><div class="node a">Canvas Card</div><div class="node b">Linked Group</div><div class="node c">Markdown</div><section class="palette"><header class="palette-header"><span class="brand">✦ Mini Palette</span><nav class="tabs"><button>Collect 3</button><button class="active">Storage 6</button></nav><div class="actions"><button class="icon">—</button><button class="icon">×</button></div></header>${mode==='wide'?'':quick}<div class="content">${mode==='wide'?controls:''}<section class="pane"><div class="pane-head"><span>Assets · 6</span><button>Grid</button></div><div class="assets">${cards(mode==='minimum'?3:6)}</div></section>${mode==='wide'||mode==='medium'?preview:''}</div><footer class="bottom"><span class="muted">Selected 1</span><button>Edit</button><button class="primary">Place on Canvas</button></footer></section>${flyout}</div></div><div class="annotation">Preview opens outside the Mini; Assets, selection and actions stay visible.</div></div>`}
  function side(mode){const width={wide:'≥ 520px',medium:'360–519px',minimum:'300–359px'}[mode];const outliner=`<section class="side-panel"><div class="pane-head"><span>Outliner</span><button class="icon">＋</button></div><div class="tree"><div>▾ Workspace</div><div class="active">　▾ UI References</div><div>　　 Reference image</div><div>　　 Research note</div><div>　▸ Components</div></div></section>`;const indexes=mode==='wide'?`<div class="index-grid"><section class="side-panel"><strong>Tag index</strong><div class="tree"><div>#design</div><div>#reference</div></div></section><section class="side-panel"><strong>Label index</strong><div class="tree"><div>Idea</div><div>Review</div></div></section></div>`:'';const flyout=mode==='minimum'?`<aside class="attached-flyout side-indexes-flyout"><button class="icon close">×</button><h3>Indexes</h3><p class="flyout-kicker">Attached to Side Palette · opens over Canvas</p><nav class="tabs"><button class="active">Tags</button><button>Labels</button></nav><div class="tree"><div>#design　3</div><div>#reference　2</div><div>#ui　1</div></div></aside>`:'';return `<div class="sheet side-${mode}"><div class="title">Side Palette — ${mode==='minimum'?'Very Narrow':mode[0].toUpperCase()+mode.slice(1)}</div><div class="measure">${width}</div><div class="app side-app"><div class="canvas-bg"><div class="node a">Canvas workspace</div></div><aside class="side"><header class="side-header"><span class="brand">Canvas Palette</span><button class="text">Export</button><button class="text">Send to Mini</button><button class="icon">⋯</button></header><div class="workspace-row"><span class="muted">Workspace</span><select><option>UI Workspace</option></select><button class="icon">⌖</button></div><div class="side-search"><input class="search" value=""><button class="icon">⌕</button><button class="icon">☷</button></div>${mode==='wide'?'':`<nav class="side-tabs"><button class="active">Viewport</button><button>Outliner</button><button class="${mode==='minimum'?'active-trigger':''}">Indexes</button></nav>`}<div class="side-body"><section class="side-panel"><div class="pane-head"><span>Viewport</span><button>Filter</button><button class="icon">◫</button></div><div class="assets">${cards(mode==='minimum'?3:4)}</div></section>${mode==='wide'?outliner:''}</div>${indexes}</aside>${flyout}</div>${mode==='wide'?'':`<div class="annotation">Indexes opens outside the Side; Viewport stays visible and interactive.</div>`}</div>`}
  document.getElementById('root').innerHTML=state.startsWith('mini-')?mini(state.slice(5)):side(state.slice(5));
</script>
</body>
</html>
